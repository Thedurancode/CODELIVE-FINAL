# ==============================================================================
# CodeLive Frontend - Fly.io Configuration
# ==============================================================================
# Deploy with: fly deploy --config frontend/fly.toml
# ==============================================================================

app = 'dispotree-web'
primary_region = 'dfw'

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_URL = "https://dispotree-api.fly.dev"
    NEXT_PUBLIC_SUPABASE_URL = "https://gnfviibtswjbcvdlptuu.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduZnZpaWJ0c3dqYmN2ZGxwdHV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5MDY5MTgsImV4cCI6MjA4MTQ4MjkxOH0.Lz5yZFlhk3fF55JkcGw18JwdFLYgM3mDl54lXpGcJuo"
    NEXT_PUBLIC_GOOGLE_MAPS_KEY = "AIzaSyDMKB_K78nD0BY0OcxlZmF4obCu1WI1Jvc"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/login"
    port = 3000
    timeout = "10s"
    type = "http"
