# ==============================================================================
# CodeLive Frontend - Fly.io Configuration
# ==============================================================================
# Deploy with: fly deploy --config frontend/fly.toml
# ==============================================================================

app = 'codelive-web'
primary_region = 'dfw'

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_API_URL = "https://codelive-api.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    port = 3000
    timeout = "10s"
    type = "http"
