name: Claude Autonomous Agent

# This workflow uses Anthropic's official claude-code-action to automatically
# work on GitHub issues and create pull requests.
#
# Triggers:
# - When someone comments "@claude work on this" on an issue
# - When someone comments "@claude implement this" on an issue
# - When an issue is assigned to the claude bot
# - Manual workflow dispatch for specific issues

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to work on'
        required: true
        type: number
      prompt:
        description: 'Custom prompt for Claude (optional)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  claude-agent:
    name: Claude Autonomous Coding Agent
    runs-on: ubuntu-latest

    # Only run if:
    # 1. Comment contains @claude
    # 2. Issue was assigned
    # 3. Manual dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') ||
      github.event_name == 'issues' && github.event.action == 'assigned'

    steps:
      - name: Check if @claude mentioned or assigned
        id: check
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "issue_number=${{ inputs.issue_number }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            if [[ "${{ github.event.comment.body }}" == *"@claude"* ]]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better context

      - name: Run Claude Code Action
        if: steps.check.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Let Claude auto-detect context from issue/comment
          # Or use custom prompt from workflow dispatch
          prompt: ${{ inputs.prompt || '' }}

          # API authentication
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Claude Code CLI arguments
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-5-20250929

      - name: Comment on issue with status
        if: steps.check.outputs.should_run == 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.check.outputs.issue_number }};
            const success = '${{ job.status }}' === 'success';

            const comment = success
              ? `✅ **Claude Agent Completed**\n\nI've analyzed the issue and ${context.payload.pull_request ? 'created a pull request' : 'worked on the changes'}.\n\nPlease review the changes and let me know if you need any adjustments!`
              : `⚠️ **Claude Agent Encountered an Issue**\n\nI had trouble processing this request. Please check the [workflow logs](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: comment
            });

      - name: Label issue
        if: steps.check.outputs.should_run == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = ${{ steps.check.outputs.issue_number }};

            // Add label to indicate Claude worked on this
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                labels: ['claude-agent']
              });
            } catch (error) {
              console.log('Could not add label (might not exist):', error.message);
            }
